        Tailwind fonctionne !

    <form action="" method="post" enctype="multipart/form-data">



        <section id="signin">
            <h2>sign in</h2>
            <label for="last name">Last name</label>
            <input type="text" name="last name" id="last name" name="last name" required>

            <label for="first name">First name</label>
            <input type="text" name="first name" id="first name" name="first name" required>

            <label for="date of birth">Date of birth</label>
            <input type="date" name="date of birth" id="date of birth" name="date of birth">

            <label for="username">Username</label>
            <input type="text" name="username" id="lusername" name="username">


        </section>

        <section id="account">
            <h2>Account</h2>
            <label for="email address"> Email address</label>
            <input type="email" name="email address" id="email address" required>

            <label for="password"> Password</label>
            <input type="password" name="password" id="password" required>

            <label for="confirm password">Confirm Password</label>
            <input type="password" name="confirm password" id="confirm password" required>


        </section>

        <section id="profile">
            <h2>Profile</h2>

            <label>
                <input type="radio" name="avatar" value="feminin">
                <img src="../Virtual_docs/Assets/icons/user-woman.png" alt="avatar-feminin">

            </label>

            <label>
                <input type="radio" name="avatar" value="masculin">
                <img src="../Virtual_docs/Assets/icons/user-man.png" alt="avatar-masculin">

            </label>

            <label>
                <input type="radio" name="avatar" value="photo">
                importer une photo depuis vos dossiers
            </label>
            <input type="file" name="photo" accept="image/*">
        </section>

        <section id="education">

            <div class="field">
                <label for="school">School name</label>
                <input type="text" name="school" id="school" placeholder="search for your school" autocomplete="off">

                <div id="schoolsuggestion" class="suggestion"></div>

            </div>



            <div class="field">

                <label for="education_level"> Education Level</label>
                <select name="education_level" id="education_level">
                    <option value="">Select your level</option>
                    <option value="secondary">Secondary School</option>
                    <option value="high">High School</option>
                    <option value="bachelor"></option>
                    <option value="masters"></option>
                    <option value="licences"></option>
                    <option value="others"></option>

            </div>
            </select>

                            <span>ESP32</span>
                        </label>
                    </div>

                    <div class="competence">
                        <input type="checkbox" id="micropython" name="competences" value="MicroPython">
                        <label for="micropython">
                            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/micropython.svg"
                                alt="MicroPython">
                            <span>MicroPython</span>
                        </label>
                    </div>

                    <div class="competence">
                        <input type="checkbox" id="nmap" name="competences" value="Nmap">
                        <label for="nmap">
                            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/nmap.svg" alt="Nmap">
                            <span>Nmap</span>
                        </label>
                    </div>

                    <div class="competence">
                        <input type="checkbox" id="roblox" name="competences" value="Roblox Studio">
                        <label for="roblox">
                            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/robloxstudio.svg"
                                alt="Roblox Studio">
                            <span>Roblox Studio</span>
                        </label>
                    </div>

                    <div class="competence">
                        <input type="checkbox" id="tcpip" name="competences" value="TCP/IP">
                        <label for="tcpip">
                            <span>TCP/IP</span>
                        </label>
                    </div>

                    <div class="competence">
                        <input type="checkbox" id="vpn" name="competences" value="VPN">
                        <label for="vpn">
                            <span>VPN</span>
                        </label>
                    </div>

                    <div class="competence">
                        <input type="checkbox" id="wireshark" name="competences" value="Wireshark">
                        <label for="wireshark">
                            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/wireshark.svg"
                                alt="Wireshark">
                            <span>Wireshark</span>
                        </label>
                    </div>
                </div>
            </div>
        </section>

        <section id="competences-acquises">
            <h2>Existing Skills</h2>

            <div class="field">
                <label for="existingSkill">Your skills</label>

                <input type="text" id="existingSkill" name="existingSkill" placeholder="Search or enter a skill"
                    autocomplete="off">

                <div id="existingSkillSuggestions" class="suggestions"></div>
            </div>

            <div id="selectedSkills" class="selected-skills"></div>
        </section>

        <section id="objectifs">
            <h2>Objectives</h2>

            <div class="objectifs-liste">

                <div class="objectif">
                    <input type="checkbox" id="learn" name="objectifs" value="Learn new technologies">
                    <label for="learn">Learn new technologies</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="improve" name="objectifs" value="Improve my technical skills">
                    <label for="improve">Improve my technical skills</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="projects" name="objectifs" value="Work on projects">
                    <label for="projects">Work on projects</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="internship" name="objectifs" value="Find an internship">
                    <label for="internship">Find an internship</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="job" name="objectifs" value="Find a job">
                    <label for="job">Find a job</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="portfolio" name="objectifs" value="Build my portfolio">
                    <label for="portfolio">Build my portfolio</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="collaboration" name="objectifs" value="Collaborate with other students">
                    <label for="collaboration">Collaborate with other students</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="teamwork" name="objectifs" value="Learn to work in a team">
                    <label for="teamwork">Learn to work in a team</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="certifications" name="objectifs" value="Prepare for certifications">
                    <label for="certifications">Prepare for certifications</label>
                </div>

                <div class="objectif">
                    <input type="checkbox" id="personal-project" name="objectifs" value="Create a personal project">
                    <label for="personal-project">Create a personal project</label>
                </div>

            </div>

            <div class="field">
                <label for="custom_objective">Other objective</label>
                <textarea id="custom_objective" name="custom_objective" placeholder="Write your own objective..."
                    rows="4">
        </textarea>
            </div>
        </section>


        <section id="localisation">
            <h2>Location</h2>

            <div class="field">
                <label for="country">Country</label>
                <input type="text" id="country" name="country" placeholder="Enter your country" required>
            </div>

            <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" placeholder="Enter your city" required>
            </div>

            <div class="field">
                <label for="neighborhood">Neighborhood</label>
                <input type="text" id="neighborhood" name="neighborhood" placeholder="Enter your neighborhood" required>
            </div>
        </section>

        <section id="a-propos">
            <h2>About You</h2>

            <div class="field">
                <label for="bio">Bio</label>
                <textarea id="bio" name="bio" placeholder="Tell us a little about yourself..." rows="5"></textarea>
            </div>

            <div class="field">
                <label for="interests">Interests</label>
                <textarea id="interests" name="interests" placeholder="Tell us about your interests..."
                    rows="4"></textarea>
            </div>

            <div class="field">
                <label for="github">GitHub</label>
                <input type="url" id="github" name="github" placeholder="https://github.com/username">
            </div>

            <div class="field">
                <label for="portfolio">Portfolio</label>
                <input type="url" id="portfolio" name="portfolio" placeholder="https://your-portfolio.com">
            </div>
        </section>

        <section id="validation">
            <h2>Validation</h2>

            <div class="agreement">
                <input type="checkbox" id="terms" name="terms" required>

                <label for="terms">
                    I agree to the Terms and Conditions and confirm that
                    the information I have provided is accurate.
                </label>
            </div>

            <button type="submit">
                Create my profile
            </button>

        </section>








    </form>




</body>

</html>
